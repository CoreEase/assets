name: Download Gifts

on:
  workflow_dispatch:
  
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run downloader
        run: python gifts/download_gifts.py

      - name: Upload gifts as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gifts
          path: gifts/
          retention-days: 7
