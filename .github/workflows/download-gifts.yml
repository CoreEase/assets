name: Download Gifts

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run downloader
        run: python gifts/gift-downloader.py

      - name: Check if files were created
        run: |
          if [ -d "gifts" ] && [ "$(ls -A gifts)" ]; then
            echo "✅ Gifts downloaded successfully"
            ls -la gifts/
          else
            echo "❌ No gifts found!"
            exit 1
          fi

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gifts/
          git diff --staged --quiet || git commit -m "Update gifts [skip ci]"
          git push
